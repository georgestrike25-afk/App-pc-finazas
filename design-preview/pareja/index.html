<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Brote · modo pareja (propuesta)</title>
<style>
  @font-face { font-family: 'Inter'; font-weight: 100 900; src: url(../prototype/fonts/inter-latin-wght-normal.woff2) format('woff2'); }
  :root {
    --forest: #123c3a; --lime: #a3e635; --lime-soft: #ecfccb;
    --bg: #f7faf5; --surface: #ffffff; --surface-2: #eef3eb; --text: #18312e; --muted: #5e6f67; --border: #dce5d7; --border-strong: #c3d1bc;
    --primary: #123c3a; --primary-ink: #fff; --ok: #15803d; --danger: #dc2626; --warn: #b45309;
    --ok-soft: color-mix(in srgb, #15803d 12%, transparent); --warn-soft: color-mix(in srgb, #b45309 12%, transparent);
    --wall-1: #dfe8e2; --wall-2: #bfd0c6; --shade: rgba(247, 250, 245, 0.97); --scrim: rgba(13, 23, 20, 0.45);
    --hero: #123c3a; --hero-text: #fff; --hero-muted: #b7cdc3; --anto: #2f6b5e;
  }
  :root[data-theme='dark'] {
    --bg: #0d1714; --surface: #192722; --surface-2: #22342c; --text: #f1f7f0; --muted: #b2c3b7; --border: #34483c; --border-strong: #46604f;
    --primary: #a3e635; --primary-ink: #123c3a; --ok: #86efac; --danger: #fda4af; --warn: #fcd34d;
    --ok-soft: color-mix(in srgb, #86efac 14%, transparent); --warn-soft: color-mix(in srgb, #fcd34d 14%, transparent);
    --wall-1: #0f1a16; --wall-2: #1d2f27; --shade: rgba(13, 23, 20, 0.97); --scrim: rgba(0, 0, 0, 0.6);
    --hero: #22342c; --hero-text: #f1f7f0; --hero-muted: #b2c3b7; --anto: #6fbfa9;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 15px/1.45 Inter, Roboto, system-ui, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }
  svg { flex-shrink: 0; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .small { font-size: 0.82rem; }
  .phone { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: var(--bg); display: flex; flex-direction: column; }
  .phone.home { background: linear-gradient(160deg, var(--wall-1), var(--wall-2)); }
  .status { height: 36px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-size: 0.86rem; font-weight: 600; position: relative; z-index: 6; }
  .status .ic { display: flex; gap: 6px; }
  .status svg { width: 16px; height: 16px; }
  .who-phone { position: absolute; top: 7px; left: 50%; transform: translateX(-50%); z-index: 7; font-size: 0.72rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--forest); color: #fff; }
  .top { display: flex; align-items: center; gap: 10px; padding: 8px 16px 4px; }
  .top h1 { margin: 0; font-size: 1.2rem; flex: 1; }
  .top .sub { font-size: 0.8rem; color: var(--muted); }
  .top svg { width: 22px; height: 22px; }
  .body { flex: 1; overflow: hidden; padding: 8px 16px 90px; display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
  .card h2 { margin: 0 0 10px; font-size: 1rem; display: flex; align-items: center; gap: 8px; }
  .card h2 .r { margin-left: auto; font-size: 0.8rem; font-weight: 600; color: var(--muted); }
  .hero { background: var(--hero); color: var(--hero-text); border: 0; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 4px; }
  .hero .lbl { color: var(--hero-muted); font-size: 0.86rem; }
  .hero .amt { font-size: 2.3rem; font-weight: 750; letter-spacing: -0.03em; line-height: 1.05; }
  .hero .amt .c { font-size: 0.45em; vertical-align: 0.9em; font-weight: 600; }
  .hero .bar { width: 28px; height: 4px; border-radius: 2px; background: var(--lime); margin-bottom: 8px; }
  .hero .row { display: flex; gap: 10px; margin-top: 12px; }
  .hero .btn.primary { background: var(--lime); border-color: var(--lime); color: var(--forest); }
  .hero .btn.ghost { color: var(--hero-text); border-color: rgba(255, 255, 255, 0.25); }
  .pair { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--hero-muted); }
  .av { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 0.72rem; font-weight: 800; flex-shrink: 0; }
  .av.j { background: var(--lime); color: var(--forest); }
  .av.a { background: var(--anto); color: #fff; }
  :root[data-theme='dark'] .av.a { color: var(--forest); }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .split > div { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
  .split .l { font-size: 0.76rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .split .v { font-weight: 750; font-size: 1.05rem; }
  .split .s { font-size: 0.74rem; color: var(--muted); }
  .lst { list-style: none; margin: 0; padding: 0; }
  .lst li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .lst li:last-child { border-bottom: 0; padding-bottom: 0; }
  .lst .ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); flex-shrink: 0; }
  .lst .ico svg { width: 18px; height: 18px; }
  .lst .grow { flex: 1; min-width: 0; }
  .lst .t { font-weight: 600; font-size: 0.9rem; }
  .lst .s { font-size: 0.74rem; color: var(--muted); display: flex; align-items: center; gap: 4px; }
  .lst .m { text-align: right; }
  .lst .m b { display: block; font-size: 0.92rem; }
  .lst .m span { font-size: 0.72rem; color: var(--muted); }
  .tag { display: inline-flex; align-items: center; gap: 4px; font-size: 0.7rem; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
  .tag.ok { background: var(--ok-soft); color: var(--ok); }
  .tag.lime { background: var(--lime-soft); color: var(--forest); }
  :root[data-theme='dark'] .tag.lime { background: color-mix(in srgb, var(--lime) 18%, transparent); color: var(--lime); }
  .tag svg { width: 12px; height: 12px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 16px; border-radius: 12px; font-weight: 700; font-size: 0.92rem; border: 1.5px solid var(--border-strong); background: transparent; color: var(--text); flex: 1; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
  .btn svg { width: 18px; height: 18px; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: 12px; background: var(--surface-2); }
  .seg b { display: flex; justify-content: center; align-items: center; gap: 6px; padding: 8px 4px; border-radius: 9px; font-size: 0.84rem; font-weight: 650; color: var(--muted); }
  .seg b svg { width: 16px; height: 16px; }
  .seg b.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1); }
  :root[data-theme='dark'] .seg b.on { background: var(--lime); color: var(--forest); }
  .bottom { position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--border); padding: 6px 4px 12px; }
  .bottom a { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 0.7rem; color: var(--muted); font-weight: 550; }
  .bottom a span { width: 54px; height: 28px; border-radius: 999px; display: grid; place-items: center; }
  .bottom a svg { width: 19px; height: 19px; }
  .bottom a.on { color: var(--text); font-weight: 700; }
  .bottom a.on span { background: var(--lime); color: var(--forest); }
  .note { display: flex; gap: 8px; align-items: flex-start; font-size: 0.78rem; color: var(--muted); padding: 10px 12px; border-radius: 12px; background: var(--surface-2); }
  .note svg { width: 16px; height: 16px; margin-top: 1px; }

  /* hojas y diálogos */
  .scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 4; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-radius: 24px 24px 0 0; padding: 10px 18px 22px; display: flex; flex-direction: column; gap: 14px; }
  .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--border-strong); margin: 0 auto; }
  .s-head { display: flex; align-items: center; gap: 10px; }
  .s-head img { width: 28px; height: 28px; border-radius: 8px; }
  .s-head h2 { margin: 0; font-size: 1.05rem; }
  .s-head p { margin: 0; font-size: 0.78rem; color: var(--muted); }
  .bigamt { text-align: center; font-size: 2.6rem; font-weight: 750; letter-spacing: -0.035em; line-height: 1.05; }
  .halves { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .halves > div { display: flex; align-items: center; gap: 8px; padding: 10px; border-radius: 12px; border: 1px solid var(--border); font-size: 0.8rem; }
  .halves b { display: block; font-size: 0.95rem; }
  .cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .cat { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 9px 4px; border-radius: 12px; border: 1.5px solid var(--border); font-size: 0.74rem; font-weight: 600; color: var(--muted); }
  .cat i { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); color: var(--text); }
  .cat i svg { width: 17px; height: 17px; }
  .cat.on { border-color: var(--primary); color: var(--text); background: color-mix(in srgb, var(--lime) 16%, transparent); }
  .cat.on i { background: var(--lime); color: var(--forest); }
  .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .keys b { display: grid; place-items: center; height: 42px; border-radius: 11px; background: var(--surface-2); font-size: 1.1rem; font-weight: 600; }
  .keys b svg { width: 20px; height: 20px; }
  .registra { display: flex; flex-direction: column; gap: 8px; }
  .registra > div { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); font-size: 0.84rem; }
  .registra b { display: block; }

  /* avisos */
  .shade { position: absolute; inset: 0; background: var(--shade); z-index: 4; padding: 50px 12px 0; display: flex; flex-direction: column; gap: 10px; }
  .notif { background: var(--surface); border-radius: 20px; padding: 14px 14px 10px; border: 1px solid var(--border); }
  .n-top { display: flex; align-items: center; gap: 8px; font-size: 0.76rem; color: var(--muted); margin-bottom: 6px; }
  .n-top img { width: 20px; height: 20px; border-radius: 6px; }
  .n-top b { color: var(--text); }
  .notif h3 { margin: 0; font-size: 0.95rem; }
  .notif p { margin: 2px 0 0; font-size: 0.86rem; color: var(--muted); }
  .n-acts { display: flex; gap: 6px; margin-top: 10px; }
  .n-acts b { padding: 7px 14px; border-radius: 999px; font-size: 0.84rem; font-weight: 650; background: var(--surface-2); }
  .n-acts b.main { background: var(--primary); color: var(--primary-ink); }
  .n-group { font-size: 0.78rem; color: var(--muted); padding: 4px 6px 0; font-weight: 600; }

  /* widget */
  .clock { padding: 18px 24px 4px; }
  .clock b { font-size: 3.4rem; font-weight: 300; letter-spacing: -0.03em; line-height: 1; display: block; }
  .widget { margin: 16px; background: var(--surface); border-radius: 24px; padding: 14px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.14); display: flex; flex-direction: column; gap: 12px; }
  .w-head { display: flex; align-items: center; gap: 8px; }
  .w-head img { width: 26px; height: 26px; border-radius: 7px; }
  .w-head strong { flex: 1; }
  .w-bal { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--surface-2); }
  .w-btns { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 8px; }
  .w-btn { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; border-radius: 14px; font-weight: 650; font-size: 0.84rem; background: var(--surface-2); }
  .w-btn svg { width: 18px; height: 18px; }
  .w-btn.main { background: var(--primary); color: var(--primary-ink); }
  .apps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px 10px; padding: 8px 22px; }
  .apps i { width: 54px; height: 54px; border-radius: 16px; background: color-mix(in srgb, var(--text) 14%, transparent); display: block; margin: 0 auto; }

  /* emparejar */
  .qr { width: 180px; height: 180px; margin: 4px auto; padding: 10px; background: #fff; border-radius: 14px; }
  .code { text-align: center; font-weight: 800; letter-spacing: 0.08em; font-size: 1.2rem; }
  .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; counter-reset: p; }
  .steps li { display: flex; gap: 10px; align-items: flex-start; font-size: 0.86rem; counter-increment: p; }
  .steps li::before { content: counter(p); width: 22px; height: 22px; border-radius: 50%; background: var(--lime); color: var(--forest); font-weight: 800; font-size: 0.76rem; display: grid; place-items: center; flex-shrink: 0; }
  .fx-prog { display: flex; align-items: center; gap: 10px; font-size: 0.8rem; color: var(--muted); }
  .fx-prog .bar2 { flex: 1; height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .fx-prog .bar2 i { display: block; height: 100%; width: 57%; background: var(--primary); border-radius: 999px; }
  .falta { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 10px; font-weight: 700; font-size: 0.82rem; background: var(--primary); color: var(--primary-ink); }
  .falta svg { width: 15px; height: 15px; }
  .lst .ico.dash { background: transparent; border: 1.5px dashed var(--border-strong); color: var(--muted); }
  .ed { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--border); }
  .ed:last-child { border-bottom: 0; }
  .ed .grow { flex: 1; min-width: 0; }
  .ed .t { font-weight: 600; font-size: 0.9rem; }
  .ed .s { font-size: 0.74rem; color: var(--muted); }
  .ed .h { color: var(--muted); }
  .ed .h svg { width: 18px; height: 18px; }
  .addrow { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; border-radius: 12px; border: 1.5px dashed var(--border-strong); font-weight: 650; font-size: 0.86rem; color: var(--muted); }
  .addrow svg { width: 18px; height: 18px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="icons.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  document.documentElement.dataset.theme = q.get('tema') === 'dark' ? 'dark' : 'light';
  const I = (n) => window.ICONS[n] || '';
  const status = `<div class="status"><span>19:42</span><span class="ic">${I('Signal')}${I('Wifi')}${I('BatteryFull')}</span></div>`;
  const de = (q) => `<span class="who-phone">Celular de ${q}</span>`;
  const bottom = (on) => `<nav class="bottom">${[['Inicio', 'Wallet'], ['Gastos', 'Receipt'], ['Deudas', 'Shapes'], ['Viaje', 'Calendar'], ['Más', 'Ellipsis']].map(([t, ic]) => `<a class="${t === on ? 'on' : ''}"><span>${I(ic)}</span>${t}</a>`).join('')}</nav>`;
  const av = (w) => `<span class="av ${w === 'J' ? 'j' : 'a'}">${w}</span>`;
  const row = (ic, t, s, total, mitad, who, extra = '') => `<li><span class="ico">${I(ic)}</span><div class="grow"><div class="t">${t}</div><div class="s">${av(who)} pagó ${who === 'J' ? 'Jorge' : 'Antonella'} · ${s}${extra}</div></div><div class="m num"><b>${mitad}</b><span>de ${total}</span></div></li>`;

  // QR de muestra (dibujo, no es un código real)
  function qr() {
    let s = '', seed = 7;
    const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    for (let y = 0; y < 25; y++) for (let x = 0; x < 25; x++) {
      const corner = (x < 7 && y < 7) || (x > 17 && y < 7) || (x < 7 && y > 17);
      if (corner) continue;
      if (rnd() > 0.52) s += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
    }
    const eye = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#fff"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3"/>`;
    return `<svg class="qr" viewBox="0 0 25 25" fill="#123c3a" shape-rendering="crispEdges">${s}${eye(0, 0)}${eye(18, 0)}${eye(0, 18)}</svg>`;
  }

  const S = {
    emparejar: () => `<div class="phone">${status}${de('Jorge')}
      <div class="top">${I('ArrowLeft')}<div style="flex:1"><h1>Modo pareja</h1><div class="sub">Compartir gastos con Antonella</div></div></div>
      <div class="body">
        <section class="card" style="text-align:center"><h2 style="justify-content:center">${I('Link')}Conectá los dos celulares</h2>
          ${qr()}
          <div class="code num">BROTE · 7K4P · 2M9X</div>
          <p class="small muted" style="margin:6px 0 0">Antonella abre Brote → Modo pareja → <b>Escanear</b> (o escribe el código).</p>
        </section>
        <section class="card"><h2>${I('ShieldCheck')}Qué se comparte</h2>
          <ol class="steps">
            <li><span>Solo los gastos que marquen como <b>compartidos</b> y los pagos entre ustedes.</span></li>
            <li><span>Tu sueldo, tus gastos personales, tus deudas y tu plata hasta cobrar <b>no se comparten</b>.</span></li>
            <li><span>Viaja cifrado entre los dos celulares: nadie más lo puede leer.</span></li>
          </ol>
        </section>
        <section class="card"><h2>Reparto</h2>
          <div class="seg"><b class="on">Mitad y mitad</b><b>Otro %</b></div>
          <p class="small muted" style="margin:8px 0 0">Se puede cambiar en un gasto puntual (por ejemplo, 60 / 40).</p>
        </section>
      </div>${bottom('Más')}</div>`,

    compartidos: () => `<div class="phone">${status}${de('Jorge')}
      <div class="top"><div style="flex:1"><h1>Con Antonella</h1><div class="sub">Octubre de 2026</div></div><span class="tag ok">${I('RefreshCw')}al día · hace 2 min</span></div>
      <div class="body">
        <section class="hero">
          <div class="bar"></div>
          <span class="pair">${av('J')}${I('ArrowRightLeft')}${av('A')} Saldo del mes</span>
          <span class="lbl" style="margin-top:6px">Le tenés que pasar a Antonella</span>
          <div class="amt num">$ 238.000<span class="c">,00</span></div>
          <div class="row"><b class="btn primary">${I('Check')}Pagado</b><b class="btn ghost">Ver detalle</b></div>
        </section>
        <div class="split">
          <div><div class="l">${av('A')}Pagó Antonella</div><div class="v num">$ 738.000</div><div class="s">tu mitad: $ 369.000</div></div>
          <div><div class="l">${av('J')}Pagaste vos</div><div class="v num">$ 262.000</div><div class="s">su mitad: $ 131.000</div></div>
        </div>
        <section class="card"><h2>Gastos fijos de octubre<span class="r">tu mitad</span></h2>
          <ul class="lst">
            ${row('House', 'Alquiler', 'se repite', '$ 600.000', '$ 300.000', 'A')}
            ${row('Zap', 'Luz', '12/10', '$ 48.000', '$ 24.000', 'A')}
            ${row('Flame', 'Gas', '10/10', '$ 22.000', '$ 11.000', 'A')}
            ${row('HeartPulse', 'Sancor Salud', 'Visa', '$ 250.000', '$ 125.000', 'J')}
          </ul>
        </section>
      </div>${bottom('Gastos')}</div>`,

    anotar: () => `<div class="phone home">${status}${de('Antonella')}
      <div class="clock"><b>19:42</b><span class="small">jueves, 23 de octubre</span></div>
      <div class="scrim"></div>
      <section class="sheet">
        <div class="grab"></div>
        <div class="s-head"><img src="brote-mark.png" alt=""><div><h2>Anotar</h2><p>Anotación rápida</p></div></div>
        <div class="seg"><b>${I('Minus')}Gasto</b><b>${I('Plus')}Ingreso</b><b class="on">${I('Users')}Con Jorge</b></div>
        <div class="bigamt num">$ 50.000</div>
        <div class="halves">
          <div>${av('A')}<span>Tu mitad<b class="num">$ 25.000</b></span></div>
          <div>${av('J')}<span>A Jorge le aparece<b class="num">$ 25.000</b></span></div>
        </div>
        <div class="seg"><b class="on">Lo pagué yo</b><b>Lo pagó Jorge</b></div>
        <div class="cats">
          <div class="cat on"><i>${I('ShoppingCart')}</i>Día a día</div>
          <div class="cat"><i>${I('House')}</i>Casa</div>
          <div class="cat"><i>${I('Zap')}</i>Servicios</div>
          <div class="cat"><i>${I('Shapes')}</i>Otros</div>
        </div>
        <div class="keys">${['1','2','3','4','5','6','7','8','9',',','0'].map((k) => `<b>${k}</b>`).join('')}<b>${I('Delete')}</b></div>
        <div style="display:grid;grid-template-columns:1fr 1.4fr;gap:10px"><b class="btn">Cancelar</b><b class="btn primary">${I('Check')}Guardar</b></div>
