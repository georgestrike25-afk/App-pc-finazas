name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar, probar y empaquetar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Recursos generados al día
        run: |
          python3 tools/aura_icons.py
          python3 tools/aura_widgets.py
          git diff --stat --exit-code

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas unitarias
        run: ./gradlew --stacktrace :core:test :app:testDebugUnitTest

      # Firma automática: la clave se crea una sola vez y se reutiliza desde la caché de Actions,
      # así cada APK se instala como actualización del anterior. Si existen los secretos
      # AURA_KEYSTORE_BASE64 / AURA_KEYSTORE_PASSWORD, tienen prioridad.
      - name: Recuperar clave de firma
        id: keycache
        uses: actions/cache/restore@v4
        with:
          path: ~/.aura-signing
          key: aura-signing-v1

      - name: Crear clave de firma (solo la primera vez)
        if: steps.keycache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.aura-signing
          pw=$(openssl rand -base64 24 | tr -d '/+=')
          keytool -genkeypair -keystore ~/.aura-signing/aura-release.p12 -storetype PKCS12 -alias aura \
            -keyalg RSA -keysize 3072 -validity 10950 -storepass "$pw" -dname "CN=Aura, O=Aura, C=AR"
          printf '%s' "$pw" > ~/.aura-signing/password

      - name: Guardar clave de firma
        if: steps.keycache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.aura-signing
          key: aura-signing-v1

      - name: Configurar firma
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.AURA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AURA_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/aura-release.p12"
            echo "AURA_STORE_FILE=$RUNNER_TEMP/aura-release.p12" >> "$GITHUB_ENV"
            echo "AURA_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "Firma: secretos del repositorio"
          else
            echo "::add-mask::$(cat ~/.aura-signing/password)"
            echo "AURA_STORE_FILE=$HOME/.aura-signing/aura-release.p12" >> "$GITHUB_ENV"
            echo "AURA_STORE_PASSWORD=$(cat ~/.aura-signing/password)" >> "$GITHUB_ENV"
            echo "Firma: clave automática en caché"
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: APK debug y release
        run: ./gradlew --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Publicar APK en dist/
        if: github.event_name == 'push' && steps.signing.outputs.signed == 'true'
        run: |
          mkdir -p dist
          rm -f dist/*.apk
          cp app/build/outputs/apk/release/app-release.apk dist/Aura.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "APK de Aura (${GITHUB_SHA::7}) [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done

      - name: Publicar APK en la versión «aura-latest»
        if: github.event_name == 'push' && steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="APK release firmado de Aura. Rama ${GITHUB_REF_NAME}, commit ${GITHUB_SHA::7}, $(date -u '+%Y-%m-%d %H:%M UTC')."
          if ! gh release view aura-latest > /dev/null 2>&1; then
            gh release create aura-latest --title "Aura (última versión)" --notes "$notes" --prerelease --target "$GITHUB_SHA"
          else
            gh release edit aura-latest --notes "$notes"
          fi
          gh release upload aura-latest dist/Aura.apk --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: aura-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            core/build/reports/
            app/build/reports/

  emulator:
    name: Widgets reales en emulador
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: build
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK de prueba
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Pruebas instrumentadas y capturas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell settings put system time_12_24 24
            adb shell settings put global hide_error_dialogs 1
            adb shell settings put secure anr_show_background 0
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || echo "AURA_TESTS_FAILED" > /tmp/aura_failed
            mkdir -p shots
            adb exec-out run-as app.aura tar c files/aura-shots > shots.tar || true
            tar xf shots.tar -C shots || true
            adb shell dumpsys appwidget | grep -i "app.aura" | head -20 || true
            adb logcat -d -b crash | tail -60 || true
            ls -R shots || true

      - name: Guardar capturas en docs/capturas
        if: github.event_name == 'push'
        run: |
          src=shots/files/aura-shots
          [ -d "$src" ] || exit 0
          rm -rf docs/capturas && mkdir -p docs/capturas
          cp "$src"/*.png docs/capturas/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/capturas
          git commit -m "Capturas del emulador (${GITHUB_SHA::7}) [skip ci]" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: widget-screenshots
          path: shots/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-reports
          path: app/build/reports/androidTests/

      - name: Resultado
        run: test ! -f /tmp/aura_failed
