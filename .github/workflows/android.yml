name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar, probar y empaquetar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Recursos generados al día
        run: |
          python3 tools/aura_icons.py
          python3 tools/aura_widgets.py
          git diff --stat --exit-code

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas unitarias
        run: ./gradlew --stacktrace :core:test :app:testDebugUnitTest

      - name: APK debug y release
        run: ./gradlew --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Publicar APK en dist/
        if: github.event_name == 'push'
        run: |
          mkdir -p dist
          rm -f dist/*.apk
          cp app/build/outputs/apk/release/app-release.apk dist/Aura.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "APK de Aura (${GITHUB_SHA::7}) [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done

      - uses: actions/upload-artifact@v4
        with:
          name: aura-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            core/build/reports/
            app/build/reports/

  emulator:
    name: Widgets reales en emulador
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: build
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK de prueba
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Pruebas instrumentadas y capturas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell settings put system time_12_24 24
            adb shell settings put global hide_error_dialogs 1
            adb shell settings put secure anr_show_background 0
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || echo "AURA_TESTS_FAILED" > /tmp/aura_failed
            mkdir -p shots
            adb exec-out run-as app.aura tar c files/aura-shots > shots.tar || true
            tar xf shots.tar -C shots || true
            adb shell dumpsys appwidget | grep -i "app.aura" | head -20 || true
            ls -R shots || true

      - name: Guardar capturas en docs/capturas
        if: github.event_name == 'push'
        run: |
          src=shots/files/aura-shots
          [ -d "$src" ] || exit 0
          rm -rf docs/capturas && mkdir -p docs/capturas
          cp "$src"/*.png docs/capturas/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/capturas
          git commit -m "Capturas del emulador (${GITHUB_SHA::7}) [skip ci]" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: widget-screenshots
          path: shots/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-reports
          path: app/build/reports/androidTests/

      - name: Resultado
        run: test ! -f /tmp/aura_failed
